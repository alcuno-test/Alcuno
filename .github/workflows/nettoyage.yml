# Nettoyage automatique des parties en ligne dans Firebase.
# Une partie est supprimée si :
#   - aucune activité (aucun tap, personne qui rejoint) depuis 3 h, OU
#   - elle a été créée il y a plus de 10 h, quelle que soit l'activité.
# Tourne toutes les heures ; peut aussi être lancé à la main depuis l'onglet « Actions » de GitHub.
# Nécessite le secret de dépôt FIREBASE_SECRET (code secret de la base Firebase).
#
# APPLI TEST : nettoie UNIQUEMENT la base de TEST (alcuno-test-default-rtdb). Le secret FIREBASE_SECRET de ce dépôt
# doit être celui du projet Firebase alcuno-test, JAMAIS celui du vrai jeu. Sans secret, le nettoyage est sauté
# (pas d'échec toutes les heures). Ne tourne que dans le dépôt alcuno-test/Alcuno.

name: Nettoyage des parties

on:
  schedule:
    - cron: "17 */6 * * *"  # appli TEST : toutes les 6 heures (peu de parties), à la 17e minute
  workflow_dispatch:        # bouton « Run workflow » dans GitHub

jobs:
  nettoyer:
    if: github.repository == 'alcuno-test/Alcuno'
    runs-on: ubuntu-latest
    steps:
      - name: Supprimer les parties inactives ou trop vieilles
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
          DB_URL: https://alcuno-test-default-rtdb.europe-west1.firebasedatabase.app
          HEURES_INACTIVITE: 3
          HEURES_MAX: 10
        run: |
          set -euo pipefail

          if [ -z "$FIREBASE_SECRET" ]; then
            echo "Secret FIREBASE_SECRET manquant (appli TEST) : nettoyage sauté."
            exit 0
          fi

          maintenant=$(( $(date +%s) * 1000 ))
          limite_inactivite=$(( maintenant - HEURES_INACTIVITE * 3600 * 1000 ))
          limite_age=$(( maintenant - HEURES_MAX * 3600 * 1000 ))

          # -s : pas d'affichage de l'URL (qui contient le secret)
          curl -sf "$DB_URL/parties.json?auth=$FIREBASE_SECRET" > parties.json

          # Parties sans date (créées avant le nettoyage) : considérées comme vieilles
          jq -c --argjson inactif "$limite_inactivite" --argjson age "$limite_age" '
            (. // {})
            | with_entries(select(
                ((.value.activite // 0) < $inactif) or ((.value.creee // 0) < $age)
              ))
            | map_values(null)
          ' parties.json > suppressions.json

          nombre=$(jq 'length' suppressions.json)
          total=$(jq '(. // {}) | length' parties.json)
          echo "Parties en base : $total — à supprimer : $nombre"

          if [ "$nombre" -gt 0 ]; then
            jq -r 'keys[]' suppressions.json | sed 's/^/  - /'
            curl -sf -X PATCH -d @suppressions.json "$DB_URL/parties.json?auth=$FIREBASE_SECRET" > /dev/null
            echo "Suppression effectuée."
          fi

      - name: Supprimer les télés (mode « Caster ») abandonnées depuis 6 h
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
          DB_URL: https://alcuno-test-default-rtdb.europe-west1.firebasedatabase.app
          HEURES_TELE: 6
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SECRET" ]; then echo "Secret manquant (appli TEST) : nettoyage sauté."; exit 0; fi
          maintenant=$(( $(date +%s) * 1000 ))
          limite=$(( maintenant - HEURES_TELE * 3600 * 1000 ))

          curl -sf "$DB_URL/tele.json?auth=$FIREBASE_SECRET" > tele.json

          jq -c --argjson limite "$limite" '
            (. // {})
            | with_entries(select((.value.maj // 0) < $limite))
            | map_values(null)
          ' tele.json > suppressions_tele.json

          nombre=$(jq 'length' suppressions_tele.json)
          echo "Télés à supprimer : $nombre"
          if [ "$nombre" -gt 0 ]; then
            curl -sf -X PATCH -d @suppressions_tele.json "$DB_URL/tele.json?auth=$FIREBASE_SECRET" > /dev/null
            echo "Suppression effectuée."
          fi
