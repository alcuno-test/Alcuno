<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 624" width="400" height="624">
  <!-- Carte « Coup de foudre » (mode hot, période Saint-Valentin) : même style que Cupidon (cadre noir, ovale penché, coins),
       en rouge : des lèvres (bisou) frappées d'un éclair. De dos, elle est comme les autres cartes. -->
  <defs>
    <linearGradient id="ov" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb3c4"/><stop offset="1" stop-color="#f0507a"/></linearGradient>
    <linearGradient id="levre" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8102e"/><stop offset="1" stop-color="#8e0016"/></linearGradient>
    <linearGradient id="eclair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6b0"/><stop offset=".5" stop-color="#ffd23f"/><stop offset="1" stop-color="#f29a00"/></linearGradient>
    <g id="coin">
      <ellipse rx="34" ry="42" fill="#d6143a" stroke="#fff" stroke-width="7"/>
      <path d="M6 -26 L-12 4 L2 4 L-6 28 L14 -4 L0 -4 Z" fill="#ffe14a" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="400" height="624" fill="#fff"/>
  <rect x="14" y="14" width="372" height="596" rx="26" fill="#0a0a0a"/>
  <g transform="rotate(32 200 312)">
    <ellipse cx="200" cy="312" rx="166" ry="250" fill="#fff"/>
    <ellipse cx="200" cy="312" rx="152" ry="236" fill="url(#ov)"/>
  </g>
  <!-- lèvres (bisou) -->
  <g transform="translate(200 322) scale(1.12)">
    <path d="M-118 -6 C-92 -54 -48 -70 -18 -42 C-8 -50 8 -50 18 -42 C48 -70 92 -54 118 -6 C78 -2 34 4 0 6 C-34 4 -78 -2 -118 -6 Z" fill="url(#levre)" stroke="#fff" stroke-width="9" stroke-linejoin="round"/>
    <path d="M-118 -6 C-80 74 80 74 118 -6 C78 6 34 14 0 14 C-34 14 -78 6 -118 -6 Z" fill="url(#levre)" stroke="#fff" stroke-width="9" stroke-linejoin="round"/>
    <path d="M-104 -6 C-60 4 60 4 104 -6" stroke="#6e0012" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M-62 -38 C-48 -48 -30 -48 -24 -40" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" opacity=".55"/>
    <path d="M-50 40 C-30 52 -6 54 10 52" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" opacity=".45"/>
  </g>
  <!-- éclair qui traverse les lèvres en biais (comme la flèche dans le cœur de Cupidon) -->
  <g transform="translate(258 250) rotate(18) scale(.62)">
    <path d="M30 -170 L-58 38 L4 38 L-46 250 L82 -8 L16 -8 L66 -170 Z" fill="url(#eclair)" stroke="#fff" stroke-width="14" stroke-linejoin="round"/>
    <path d="M30 -170 L-58 38 L4 38 L-46 250 L82 -8 L16 -8 L66 -170 Z" fill="none" stroke="#7a3a00" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <use href="#coin" x="66" y="84"/>
  <g transform="translate(334 540) rotate(180)"><use href="#coin"/></g>
</svg>
