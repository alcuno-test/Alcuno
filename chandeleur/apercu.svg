<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- Aperçu du thème Chandeleur dans les Réglages : une poêle de cuivre d'où saute une crêpe (animée) -->
  <style>
    .s{ transform-origin: 20px 22px; animation: saut 2.2s ease-in-out infinite; }
    @keyframes saut{ 0%,40%{ transform: translateY(0) scaleY(1) } 62%{ transform: translateY(-13px) scaleY(.25) } 78%{ transform: translateY(-9px) scaleY(-1) } 92%{ transform: translateY(0) scaleY(.8) } 100%{ transform: translateY(0) scaleY(1) } }
  </style>
  <defs><radialGradient id="fond" cx=".5" cy=".3" r=".9"><stop offset="0" stop-color="#f08a3a"/><stop offset="1" stop-color="#c4501a"/></radialGradient>
    <radialGradient id="c" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#ffd978"/><stop offset="1" stop-color="#e0901e"/></radialGradient>
    <linearGradient id="cu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0a060"/><stop offset="1" stop-color="#b5551a"/></linearGradient></defs>
  <rect width="40" height="40" fill="url(#fond)"/>
  <g fill="#fff" opacity=".85"><circle cx="8" cy="9" r=".8"/><circle cx="32" cy="8" r=".7"/><circle cx="34" cy="17" r=".6"/></g>
  <g class="s"><ellipse cx="20" cy="22" rx="9" ry="2.6" fill="url(#c)" stroke="#b8650f" stroke-width="1"/><g fill="#b8650f" opacity=".6"><circle cx="16.5" cy="22" r=".8"/><circle cx="21" cy="22.6" r=".9"/><circle cx="24" cy="21.6" r=".7"/></g></g>
  <path d="M25 31 L38 34 L37.4 36 L24.6 33z" fill="#8a4a1c" stroke="#5e2f10" stroke-width=".7"/>
  <ellipse cx="18" cy="30.5" rx="12.5" ry="3.4" fill="#7a3a12" stroke="#5e2f10" stroke-width=".8"/>
  <path d="M5.5 30.5 Q5.5 36.5 18 37 Q30.5 36.5 30.5 30.5 Q18 34.5 5.5 30.5z" fill="url(#cu)" stroke="#5e2f10" stroke-width=".8"/>
  <ellipse cx="11" cy="9.5" rx="6" ry="3.4" transform="rotate(-38 11 9.5)" fill="#fff" opacity=".28"/>
</svg>